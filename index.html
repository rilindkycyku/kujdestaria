<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` bashkë me `env(safe-area-inset-*)` te CSS-i, që faqja
         e instaluar në iPhone të mos hyjë nën qoshet e rrumbullakuara. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#047857" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080f1a" media="(prefers-color-scheme: dark)" />

    <!-- Tema e zgjedhur nga përdoruesi. Bllokuese dhe jashtë paketës me qëllim: duhet
         të vlejë para vizatimit të parë, përndryshe faqja ndizet një çast me temën e
         sistemit. Rri pas `theme-color`-ëve, sepse i lexon ata. -->
    <script src="/tema.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kujdestaria" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Kujdestaria" />

    <!-- Titulli dhe përshkrimi rishkruhen gjatë ndërtimit nga `scripts/parafaqja.mjs`,
         që të dalin nga vetë orari dhe të mos vjetrohen kur komuna publikon orarin e ri.
         Aty shtohen edhe `canonical` e `og:url`, sepse domeni nuk dihet këtu.
         Ajo që rri në këtë skedar është vetëm rezerva për `npm run dev`. -->
    <title>Barnatorja kujdestare në Kaçanik — orari i kujdestarisë</title>
    <meta
      name="description"
      content="Cila barnatore është kujdestare sonte në Kaçanik, e hapur 22:00–08:00. Orari zyrtar i kujdestarisë natë për natë, me adresa dhe harta. Punon edhe pa internet."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Rilind Kyçyku" />
    <link rel="author" href="https://rilindkycyku.dev" />

    <!-- Qyteti ku vlen orari. Koordinatat janë të qendrës së Kaçanikut, jo të ndonjë
         barnatoreje — vendin e secilës e mban lidhja e saj e Google Maps-it. -->
    <meta name="geo.region" content="XK" />
    <meta name="geo.placename" content="Kaçanik" />
    <meta name="geo.position" content="42.2317;21.2597" />
    <meta name="ICBM" content="42.2317, 21.2597" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sq_AL" />
    <meta property="og:site_name" content="Kujdestaria e barnatoreve" />
    <meta property="og:title" content="Barnatorja kujdestare në Kaçanik — orari i kujdestarisë" />
    <meta
      property="og:description"
      content="Cila barnatore është kujdestare sonte në Kaçanik, e hapur 22:00–08:00. Orari zyrtar i kujdestarisë natë për natë, me adresa dhe harta. Punon edhe pa internet."
    />
    <!-- Rrugët bëhen të plota pas ndërtimit nga `scripts/parafaqja.mjs`, sepse
         WhatsApp-i dhe Facebook-u kërkojnë URL absolute te `og:image`. -->
    <meta property="og:image" content="/ndarje.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kryqi i barnatores mbi fushë të kaltër" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barnatorja kujdestare në Kaçanik — orari i kujdestarisë" />
    <meta
      name="twitter:description"
      content="Cila barnatore është kujdestare sonte në Kaçanik, e hapur 22:00–08:00. Orari zyrtar i kujdestarisë natë për natë, me adresa dhe harta. Punon edhe pa internet."
    />
    <meta name="twitter:image" content="/ndarje.png" />
    <meta name="twitter:image:alt" content="Kryqi i barnatores mbi fushë të kaltër" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
