<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` bashkë me `env(safe-area-inset-*)` te CSS-i, që faqja
         e instaluar në iPhone të mos hyjë nën qoshet e rrumbullakuara. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f5aa8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5aa8'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kujdestaria" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Kujdestaria e barnatoreve — Kaçanik</title>
    <meta
      name="description"
      content="Cila barnatore është kujdestare tani në Kaçanik, e hapur 22:00–08:00. Orari zyrtar i kujdestarisë për Korrik – Gusht 2026."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sq_AL" />
    <meta property="og:site_name" content="Kujdestaria e barnatoreve" />
    <meta property="og:title" content="Kujdestaria e barnatoreve — Kaçanik" />
    <meta
      property="og:description"
      content="Cila barnatore është kujdestare tani në Kaçanik, e hapur 22:00–08:00. Punon edhe pa internet."
    />
    <!-- Rruga bëhet e plotë pas ndërtimit nga `scripts/pergatit-sw.mjs`, sepse
         WhatsApp-i dhe Facebook-u kërkojnë URL absolute te `og:image`. -->
    <meta property="og:image" content="/ndarje.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kryqi i barnatores mbi fushë të kaltër" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
